name: rebuild-hd-images
on:
  push:
    paths:
      - 'tmp/image_chunks/READY'
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild optimized WebP assets
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/image_chunks/editorial_*.b64 > /tmp/editorial.b64
          cat tmp/image_chunks/library_*.b64 > /tmp/library.b64
          base64 -d /tmp/editorial.b64 > assets/mickael-editorial.webp
          base64 -d /tmp/library.b64 > assets/mickael-library.webp
          test $(stat -c%s assets/mickael-editorial.webp) -gt 30000
          test $(stat -c%s assets/mickael-library.webp) -gt 50000
          rm -rf tmp/image_chunks
      - name: Commit rebuilt images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mickael-editorial.webp assets/mickael-library.webp tmp/image_chunks
          git commit -m "Rebuild HD editorial images"
          git push
