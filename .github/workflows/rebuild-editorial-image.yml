name: Rebuild editorial image

on:
  push:
    branches: [main]
    paths:
      - 'image_chunks/editorial_*.b64'
      - '.github/workflows/rebuild-editorial-image.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild image
        run: |
          cat image_chunks/editorial_00.b64 image_chunks/editorial_01.b64 image_chunks/editorial_02.b64 image_chunks/editorial_03.b64 | base64 -d > assets/mickael-editorial.webp
          test $(wc -c < assets/mickael-editorial.webp) -gt 20000
          file assets/mickael-editorial.webp | grep -qi 'webp'
      - name: Commit rebuilt image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mickael-editorial.webp
          git diff --cached --quiet || git commit -m "Rebuild valid homepage portrait"
          git push
